<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Create New Event Form</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-[#102216] flex items-end justify-center min-h-screen">
    <!-- Mock Background Dashboard (Dimmed) -->
    <div
      class="fixed inset-0 z-0 opacity-40 bg-gradient-to-br from-[#102216] to-[#0d1b12] flex flex-col p-6 pointer-events-none"
    >
      <div class="flex justify-between items-center mb-8">
        <div class="h-10 w-10 rounded-full bg-white/10"></div>
        <div class="h-10 w-10 rounded-full bg-white/10"></div>
      </div>
      <div class="space-y-4">
        <div class="h-32 w-full rounded-xl bg-white/5"></div>
        <div class="h-32 w-full rounded-xl bg-white/5"></div>
        <div class="h-32 w-full rounded-xl bg-white/5"></div>
      </div>
    </div>
    <!-- Main Modal Container (iOS Bottom Sheet Style) -->
    <div
      class="relative z-10 w-full max-w-[480px] bg-background-light dark:bg-background-dark rounded-t-3xl shadow-2xl flex flex-col overflow-hidden max-h-[95vh]"
    >
      <!-- BottomSheetHandle -->
      <div class="flex flex-col items-stretch">
        <button class="flex h-6 w-full items-center justify-center">
          <div
            class="h-1.5 w-12 rounded-full bg-[#cfe7d7] dark:bg-white/20"
          ></div>
        </button>
      </div>
      <!-- TopAppBar -->
      <div class="flex items-center p-4 pb-2 justify-between">
        <div
          class="text-[#0d1b12] dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer"
        >
          <span class="material-symbols-outlined text-2xl">close</span>
        </div>
        <h2
          class="text-[#0d1b12] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12 font-display"
        >
          Create New Event
        </h2>
      </div>
      <!-- Decorative Illustration Area -->
      <div class="flex justify-center py-4">
        <div
          class="w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center text-primary"
        >
          <span
            class="material-symbols-outlined text-4xl"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >featured_seasonal_and_gifts</span
          >
        </div>
      </div>
      <!-- Form Content -->
      <div class="flex-1 overflow-y-auto px-4 pb-12">
        <!-- TextField (Event Name) -->
        <div class="flex flex-wrap items-end gap-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p
              class="text-[#0d1b12] dark:text-white/90 text-base font-medium leading-normal pb-2 font-display"
            >
              Event Name
            </p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b12] dark:text-white focus:outline-0 focus:ring-0 border border-[#cfe7d7] dark:border-white/10 bg-white dark:bg-white/5 focus:border-primary h-14 placeholder:text-[#4c9a66] dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal font-display"
              placeholder="e.g. Family Christmas 2024"
              type="text"
              value=""
            />
          </label>
        </div>
        <!-- TextField (Description) -->
        <div class="flex flex-wrap items-end gap-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <div class="flex justify-between items-center pb-2">
              <p
                class="text-[#0d1b12] dark:text-white/90 text-base font-medium leading-normal font-display"
              >
                Description
              </p>
              <span
                class="text-xs text-[#4c9a66] dark:text-white/40 font-medium"
                >Optional</span
              >
            </div>
            <textarea
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d1b12] dark:text-white focus:outline-0 focus:ring-0 border border-[#cfe7d7] dark:border-white/10 bg-white dark:bg-white/5 focus:border-primary min-h-36 placeholder:text-[#4c9a66] dark:placeholder:text-white/40 p-[15px] text-base font-normal leading-normal font-display"
              placeholder="Add details like budget, theme, or location..."
            ></textarea>
          </label>
        </div>
        <!-- Action Buttons Area -->
        <div class="flex flex-col gap-3 pt-6">
          <!-- SingleButton (Create) -->
          <div class="flex">
            <button
              class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-[#0d1b12] text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform"
            >
              <span class="truncate font-display">Create Event</span>
            </button>
          </div>
          <!-- Cancel Button -->
          <div class="flex">
            <button
              class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-transparent text-[#4c9a66] dark:text-white/60 text-base font-semibold leading-normal font-display active:bg-black/5 dark:active:bg-white/5"
            >
              <span class="truncate">Cancel</span>
            </button>
          </div>
        </div>
      </div>
      <!-- Safe area spacer for iOS -->
      <div class="h-8 bg-transparent"></div>
    </div>
  </body>
</html>
