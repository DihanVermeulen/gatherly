<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>App Navigation Sidebar - gatherly</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#ec1313",
              "background-light": "#fcf8f8",
              "background-dark": "#221010",
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .active-item .material-symbols-outlined {
        font-variation-settings: "FILL" 1;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="bg-gray-200 font-display">
    <div
      class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden"
    >
      <!-- Mobile Sidebar Overlay -->
      <div class="fixed inset-0 z-50 flex">
        <!-- Sidebar Container -->
        <div
          class="flex h-full w-[280px] flex-col bg-background-light dark:bg-background-dark shadow-2xl border-r border-primary/10"
        >
          <!-- Festive Header -->
          <div class="px-6 pt-12 pb-8">
            <div class="flex items-center gap-3">
              <div
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary text-white shadow-lg shadow-primary/20"
              >
                <span class="text-2xl">🎅</span>
              </div>
              <div>
                <h1
                  class="text-xl font-extrabold tracking-tight text-[#1b0d0d] dark:text-white"
                >
                  gatherly
                </h1>
                <p
                  class="text-[10px] font-bold uppercase tracking-widest text-primary"
                >
                  Collaborative Event
                </p>
              </div>
            </div>
          </div>
          <!-- Navigation List -->
          <nav class="flex-1 px-4 space-y-1.5 overflow-y-auto">
            <!-- Dashboard (Active State) -->
            <a
              class="active-item flex h-12 items-center gap-4 rounded-xl px-4 bg-primary/10 text-primary"
              href="#"
            >
              <span
                class="material-symbols-outlined text-[24px]"
                data-icon="dashboard"
                >dashboard</span
              >
              <span class="text-base font-bold leading-tight truncate"
                >Dashboard</span
              >
            </a>
            <!-- Events -->
            <a
              class="group flex h-12 items-center gap-4 rounded-xl px-4 text-[#4a3a3a] dark:text-gray-300 hover:bg-primary/5 transition-colors"
              href="#"
            >
              <span
                class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors"
                data-icon="featured_seasonal"
                >featured_seasonal_and_gifts</span
              >
              <span class="text-base font-semibold leading-tight truncate"
                >Events</span
              >
            </a>
            <!-- Decipher Code -->
            <a
              class="group flex h-12 items-center gap-4 rounded-xl px-4 text-[#4a3a3a] dark:text-gray-300 hover:bg-primary/5 transition-colors"
              href="#"
            >
              <span
                class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors"
                data-icon="key"
                >key</span
              >
              <span class="text-base font-semibold leading-tight truncate"
                >Decipher Code</span
              >
            </a>
            <div class="my-4 border-t border-primary/5 mx-4"></div>
            <!-- Settings -->
            <a
              class="group flex h-12 items-center gap-4 rounded-xl px-4 text-[#4a3a3a] dark:text-gray-300 hover:bg-primary/5 transition-colors"
              href="#"
            >
              <span
                class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors"
                data-icon="settings"
                >settings</span
              >
              <span class="text-base font-semibold leading-tight truncate"
                >Settings</span
              >
            </a>
            <!-- Help & Support -->
            <a
              class="group flex h-12 items-center gap-4 rounded-xl px-4 text-[#4a3a3a] dark:text-gray-300 hover:bg-primary/5 transition-colors"
              href="#"
            >
              <span
                class="material-symbols-outlined text-[24px] group-hover:text-primary transition-colors"
                data-icon="help"
                >help</span
              >
              <span class="text-base font-semibold leading-tight truncate"
                >Help &amp; Support</span
              >
            </a>
          </nav>
          <!-- User Profile Card -->
          <div class="mt-auto border-t border-primary/10 p-4 bg-primary/5">
            <div class="flex items-center gap-3 p-2 mb-2">
              <div class="relative">
                <img
                  alt="User Profile"
                  class="size-11 rounded-full object-cover border-2 border-white shadow-sm"
                  data-alt="Close up portrait of Jane Doe smiling"
                  src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAAOBx6ZXqU0vDdQ3E8pGNDXpxtha23VPJjQ4C4z8WAGJdKo7u8-wezh6zU8nE-UVC3ix49Rn6zLTY8jreS4poNZuQlHFF0WWr4dPGDbUWSxpHTLXb0yfNA74TAnnd_f0TbXlxnRf4nTEToMNJbgtMjmGWXVPgmoDIoqca1xUzoAsTwCQZs56u_XJoox85TMtjWvaGSSSJOyBnktn3dpG0hAww4bWGVUnC7X2HoTeU1XEqLdfRJ-elZZ70ZJcCUPmFNIONihoTZ5I"
                />
                <span
                  class="absolute bottom-0 right-0 size-3 rounded-full border-2 border-white bg-green-500"
                ></span>
              </div>
              <div class="flex-1 min-w-0">
                <p
                  class="text-sm font-bold text-[#1b0d0d] dark:text-white truncate"
                >
                  Jane Doe
                </p>
                <p class="text-xs text-[#6a5555] dark:text-gray-400 truncate">
                  jane@holiday.com
                </p>
              </div>
            </div>
            <button
              class="flex w-full items-center justify-center gap-2 rounded-xl bg-white dark:bg-background-dark py-2.5 px-4 text-sm font-bold text-primary shadow-sm border border-primary/20 hover:bg-primary hover:text-white transition-all"
            >
              <span class="material-symbols-outlined text-lg" data-icon="logout"
                >logout</span
              >
              Logout
            </button>
          </div>
          <!-- Safe Area Bottom Spacer (iOS) -->
          <div class="h-8 bg-primary/5"></div>
        </div>
        <!-- Backdrop to close -->
        <div class="flex-1 bg-black/40 backdrop-blur-sm"></div>
      </div>
      <!-- Main Screen Content Mockup -->
      <main class="flex-1 p-6">
        <div class="flex items-center justify-between mb-8">
          <button
            class="flex size-10 items-center justify-center rounded-lg bg-white shadow-sm"
          >
            <span
              class="material-symbols-outlined text-primary"
              data-icon="menu"
              >menu</span
            >
          </button>
          <div
            class="size-10 rounded-full bg-primary/10 flex items-center justify-center"
          >
            <span
              class="material-symbols-outlined text-primary"
              data-icon="notifications"
              >notifications</span
            >
          </div>
        </div>
        <div class="space-y-4">
          <div
            class="h-32 w-full rounded-2xl bg-gradient-to-br from-primary to-[#ff4b4b] p-6 text-white shadow-lg"
          >
            <h2 class="text-xl font-bold">Upcoming Reveal</h2>
            <p class="text-white/80 text-sm mt-1">Family Christmas 2024</p>
            <div class="mt-4 flex items-center gap-2">
              <span class="text-2xl font-black">12:04:33</span>
              <span
                class="text-[10px] font-bold uppercase tracking-widest opacity-70"
                >Remaining</span
              >
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div
              class="h-24 rounded-2xl bg-white shadow-sm p-4 flex flex-col justify-between border border-gray-100"
            >
              <span
                class="material-symbols-outlined text-primary"
                data-icon="group"
                >group</span
              >
              <p class="text-xs font-bold text-gray-500">Total Groups</p>
              <p class="text-lg font-black">4</p>
            </div>
            <div
              class="h-24 rounded-2xl bg-white shadow-sm p-4 flex flex-col justify-between border border-gray-100"
            >
              <span
                class="material-symbols-outlined text-green-600"
                data-icon="redeem"
                >redeem</span
              >
              <p class="text-xs font-bold text-gray-500">Wishlist Items</p>
              <p class="text-lg font-black">12</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
